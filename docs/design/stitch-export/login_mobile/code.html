<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CampusHub | Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom micro-interactions */
        .login-card {
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(106, 0, 50, 0.15);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#f2dee1",
                        "error": "#ba1a1a",
                        "on-tertiary-container": "#71a87d",
                        "surface-variant": "#f2dee1",
                        "on-surface": "#23191b",
                        "on-tertiary-fixed": "#00210c",
                        "surface-tint": "#a4355d",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-container": "#003c1b",
                        "tertiary-fixed-dim": "#9bd4a5",
                        "secondary-fixed-dim": "#b9c7e0",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d5e3fd",
                        "on-surface-variant": "#554246",
                        "on-secondary-fixed-variant": "#3a485c",
                        "inverse-primary": "#ffb1c5",
                        "on-secondary": "#ffffff",
                        "background": "#ffffff",
                        "tertiary-fixed": "#b6f0c0",
                        "tertiary": "#00240e",
                        "on-primary-container": "#f1719a",
                        "on-secondary-fixed": "#0d1c2f",
                        "secondary": "#515f74",
                        "primary-container": "#6a0032",
                        "on-primary-fixed-variant": "#851b46",
                        "surface": "#ffffff",
                        "outline-variant": "#dbc0c5",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed-variant": "#1b512d",
                        "surface-dim": "#e9d5d8",
                        "inverse-on-surface": "#ffecef",
                        "on-background": "#23191b",
                        "surface-container-low": "#fff0f2",
                        "on-secondary-container": "#57657b",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#3f001b",
                        "surface-container": "#fde9ec",
                        "surface-container-high": "#f7e3e7",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#ffffff",
                        "primary": "#43001d",
                        "outline": "#887176",
                        "on-error-container": "#93000a",
                        "inverse-surface": "#392d30",
                        "primary-fixed": "#ffd9e1",
                        "secondary-fixed": "#d5e3fd",
                        "primary-fixed-dim": "#ffb1c5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-between overflow-hidden">
<!-- Top Section: University Branding -->
<header class="w-full pt-16 pb-8 flex flex-col items-center px-6">
<div class="relative mb-6">
<div class="w-20 h-20 bg-primary-container rounded-xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-primary text-4xl" data-icon="account_balance" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<div class="absolute -bottom-2 -right-2 w-8 h-8 bg-surface border-2 border-primary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-sm" data-icon="school" style="font-variation-settings: 'FILL' 1;">school</span>
</div>
</div>
<h1 class="font-display-lg text-display-lg text-primary tracking-tighter">CampusHub</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 text-center max-w-[280px]">
            The centralized gateway for university administration and student club management.
        </p>
</header>
<!-- Middle Section: Login Form -->
<main class="w-full flex-1 flex flex-col justify-center px-6 max-w-md login-card">
<div class="space-y-6">
<div class="space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1 uppercase" for="email">Username or Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors" data-icon="person">person</span>
</div>
<input class="w-full h-14 pl-12 pr-4 bg-surface border border-outline-variant rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="email" placeholder="e.g. j.doe@university.edu" type="text"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-xl group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
</div>
<input class="w-full h-14 pl-12 pr-12 bg-surface border border-outline-variant rounded-xl font-body-lg text-body-lg focus:ring-2 focus:ring-primary-container focus:border-primary transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-md active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span>Sign In</span>
<span class="material-symbols-outlined" data-icon="login">login</span>
</button>
<div class="flex items-center gap-4 py-2">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="font-label-sm text-label-sm text-outline-variant uppercase tracking-widest">or</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
</div>
</main>
<!-- Bottom Section: University SSO & Footer -->
<footer class="w-full px-6 pb-12 pt-4 flex flex-col gap-4">
<button class="w-full h-16 border-2 border-primary text-primary font-headline-sm text-headline-sm rounded-xl flex items-center justify-center gap-3 active:bg-surface-container-low transition-colors">
<img class="w-7 h-7 object-contain" data-alt="A refined, professional university crest logo in solid maroon against a white background, symbolizing authority and academic tradition. The design is minimalist and modern, fitting a high-end corporate university branding guide with clean lines and balanced proportions." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC_5Es8bE2kABHEXqwoBd8nnr58LK7Cv08i-JjYX51ibHETiP1E3GpVxMgO_QEFfV11vH_xfOHdGelRjWFFaFeDQ72zFa59rRKCGFFoK8qwleGBmVXbzzzIMSpLdH6nL4Y8YpSgfnUCrjGs8fAuTnXwVc1VRZ2aggEICnNr9kHgRE3CWXTmlHrHZ-2m3ToRZkc4bvflzxsB5fyPojNYbo7gL5mVTvbBsxYALyK_BbbIjKbEF4vqNcDSZQ"/>
            Sign in with University ID
        </button>
<div class="text-center mt-4">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New to CampusHub? <a class="text-primary font-bold" href="#">Contact Registrar</a>
</p>
</div>
<div class="flex justify-center gap-6 mt-6">
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Support</a>
<a class="font-label-sm text-label-sm text-outline hover:text-primary transition-colors" href="#">Terms</a>
</div>
</footer>
<script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Simple input focus effects
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('shadow-sm');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('shadow-sm');
            });
        });
    </script>
</body></html>
